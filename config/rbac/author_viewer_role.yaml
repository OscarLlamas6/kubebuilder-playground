# This rule is not used by the project kubebuilder-playground itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to catalog.bookstore.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder-playground
    app.kubernetes.io/managed-by: kustomize
  name: author-viewer-role
rules:
- apiGroups:
  - catalog.bookstore.io
  resources:
  - authors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - catalog.bookstore.io
  resources:
  - authors/status
  verbs:
  - get
